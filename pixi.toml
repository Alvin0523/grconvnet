[workspace]
name      = "grconvnet_ws"
version   = "0.1.0"
channels  = ["https://prefix.dev/conda-forge"]
platforms = ["linux-64"]

[system-requirements]
cuda = "12.8"

[tasks]
## setup
_clone-grconvnet = { cmd = "test -d grconvnet || git clone https://github.com/skumra/robotic-grasping.git grconvnet" }
_clone-jacquard  = { cmd = "test -d Jacquard_V2 || git clone https://github.com/lqh12345/Jacquard_V2.git" }
_install-airbot  = { cmd = "test -f ./sdk/.airbot_cpp_installed || (sudo dpkg -i ./sdk/airbot_cpp-5.1.6-x86_64-noble.deb && touch ./sdk/.airbot_cpp_installed)" }
setup            = { depends-on = ["_clone-grconvnet", "_clone-jacquard", "_install-airbot"], description = "Clone repos + install SDK" }
## calibration
calib-test   = { cmd = "python calibration/test_realsense.py",      description = "Test RealSense connection" }
calib-record = { cmd = "python calibration/record_robot_points.py", description = "Record end-effector positions" }
calib-label  = { cmd = "python calibration/label_points.py",        description = "Label calibration points" }
calib-run    = { cmd = "python calibration/calibration.py",         description = "Compute camera-to-robot transform" }
calib        = { depends-on = ["calib-record", "calib-label", "calib-run"], description = "Full calibration pipeline" }
## docs
docs-serve = { cmd = "zensical serve", description = "Serve docs locally" }
docs-build = { cmd = "zensical build", description = "Build static docs"  }

## sim
[tasks.sim]
description = "Run grasp pipeline in sim"
cmd  = "python DISCOVERSE/scripts_p3/grasp_pipeline.py --detector {{ detector }}"
args = [{ arg = "detector", default = "net", choices = ["net", "circle"] }]
env  = { XKB_CONFIG_ROOT = "/usr/share/X11/xkb", MUJOCO_GL = "glfw" }

[tasks.sim-eval]
description = "Evaluate grasp success rate in sim"
cmd  = "python DISCOVERSE/scripts_p3/grasp_evaluation.py --trials {{ trials }}"
args = [{ arg = "trials", default = "10" }]
env  = { XKB_CONFIG_ROOT = "/usr/share/X11/xkb", MUJOCO_GL = "egl" }

[tasks.smoke]
description = "Sim smoke test (circle, no model)"
depends-on  = [{ task = "sim", args = ["circle"] }]

## deploy
[tasks.deploy]
description = "Deploy on real AIRBOT robot"
cmd  = "python deploy/grasp_object.py --detector {{ detector }}"
args = [{ arg = "detector", default = "net", choices = ["net", "circle"] }]

[tasks.deploy-circle]
description = "Deploy with circle detector"
depends-on  = [{ task = "deploy", args = ["circle"] }]

[tasks.robot-online]
description = "Check robot connection"
cmd  = "python -c \"from airbot_py.arm import AIRBOTPlay, RobotMode; robot = AIRBOTPlay(url='{{ ip }}', port={{ port }}); robot.switch_mode(RobotMode.PLANNING_POS); print('Online')\""
args = [
  { arg = "ip",   default = "192.168.209.101" },
  { arg = "port", default = "50051" },
]

## train
[tasks.train]
description = "Train GR-ConvNet v2"
cmd = """python grconvnet/train_network.py \
  --network            {{ network }} \
  --dataset            {{ dataset }} \
  --dataset-path       {{ dataset_path }} \
  --use-depth          {{ use_depth }} \
  --use-rgb            {{ use_rgb }} \
  --use-dropout        {{ use_dropout }} \
  --dropout-prob       {{ dropout_prob }} \
  --channel-size       {{ channel_size }} \
  --input-size         {{ input_size }} \
  --split              {{ split }} \
  --ds-rotate          {{ ds_rotate }} \
  --num-workers        {{ num_workers }} \
  --batch-size         {{ batch_size }} \
  --epochs             {{ epochs }} \
  --batches-per-epoch  {{ batches_per_epoch }} \
  --optim              {{ optim }} \
  --iou-threshold      {{ iou_threshold }} \
  --random-seed        {{ random_seed }} \
  --logdir             output \
  --description        grconvnet_{{ dataset }}"""
args = [
  { arg = "network",           default = "grconvnet3",      choices = ["grconvnet", "grconvnet2", "grconvnet3", "grconvnet4"] },
  { arg = "dataset",           default = "jacquard",        choices = ["jacquard", "cornell"] },
  { arg = "dataset_path",      default = "data/jacquard_v2" },
  { arg = "use_depth",         default = "1"    },
  { arg = "use_rgb",           default = "1"    },
  { arg = "use_dropout",       default = "0"    },
  { arg = "dropout_prob",      default = "0.1"  },
  { arg = "channel_size",      default = "32"   },
  { arg = "input_size",        default = "300"  },
  { arg = "split",             default = "0.9"  },
  { arg = "ds_rotate",         default = "0.0"  },
  { arg = "num_workers",       default = "8"    },
  { arg = "batch_size",        default = "64"   },
  { arg = "epochs",            default = "50"   },
  { arg = "batches_per_epoch", default = "1000" },
  { arg = "optim",             default = "adam", choices = ["adam", "SGD"] },
  { arg = "iou_threshold",     default = "0.25" },
  { arg = "random_seed",       default = "123"  },
]
inputs  = ["grconvnet/**/*.py"]
outputs = ["output/"]

## experiment tracking & upload
[tasks.dashboard]
description = "Open trackio dashboard in browser"
cmd = "trackio show --project grconvnet_jacquard"

[tasks.sync]
description = "Sync trackio dashboard to HuggingFace Spaces"
cmd = "trackio sync --project grconvnet_jacquard"

[tasks.upload]
description = "Upload best checkpoint to HuggingFace Hub  |  hf upload <repo-id> <local-file> <remote-filename>  |  pass run=<folder name>"
cmd  = "hf upload alvin0523/grconvnet-jacquard-v2 $(ls output/{{ run }}/epoch_*.pt | sort -t_ -k4 -V | tail -1) model.pt"
args = [{ arg = "run" }]

[dependencies]
python       = "3.11.*"
numpy        = ">=2.4.3,<3"
scipy        = ">=1.17.1,<2"
matplotlib   = "*"
scikit-learn = "*"
scikit-image = ">=0.26.0,<0.27"
mujoco       = "3.6.*"
mediapy      = ">=1.2.6,<2"
plyfile      = ">=1.1,<2"
pyglm        = ">=2.8.3,<3"
zensical     = ">=0.0.41,<0.0.42"
huggingface_hub = ">=1.14.0,<2"

[pypi-dependencies]
torch              = { version = ">=2.7.0",  index = "https://download.pytorch.org/whl/cu128" }
torchvision        = { version = ">=0.22.0", index = "https://download.pytorch.org/whl/cu128" }
opencv-python      = ">=4.13.0.92,<5"
transforms3d       = "*"
airbot-py          = { path = "./sdk/airbot_py-5.1.6-py3-none-any.whl" }
loop-rate-limiters = "*"
mink               = "*"
discoverse         = { path = "./DISCOVERSE", editable = true }
open3d             = "*"
torchsummary       = "*"
trackio            = "*"
nvidia-ml-py       = "*"
pyrealsense2       = "*"

[activation.env]
PYTHONPATH = "grconvnet"
